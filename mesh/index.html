<!doctype html>
<meta charset="utf-8">
<title>Rotor Ear</title>
<!-- Old link / QR code: everything lives in the one app at ../ now. #room=R&role=node → ear, role=map → screen. -->
<script>
(function () {
  var h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  var room = h.get('room') || q.get('room'), role = h.get('role') || q.get('role');
  location.replace('../#' + (role === 'map' ? 'screen' : 'ear') + (room ? '&room=' + encodeURIComponent(room) : ''));
})();
</script>
<p><a href="../">Rotor Ear has moved: open the app</a></p>
